[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-trading-system"
version = "0.1.0"
description = "OAF-orchestrated FX research and trading application"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fxtrading = "fxtrading.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtrading"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
